<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Mala — Checklist inteligente de praia | ASF</title><meta name="description" content="Monte a mala de praia perfeita: checklist gerado por tipo de sessão (surf, treino, competição). Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-mala/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:40px 20px 30px;text-align:center}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.tipos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tipos button{border:2px solid var(--p);background:#fff;color:var(--p);font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}.tipos button.on{background:var(--p);color:#fff}.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(14,36,57,.06)}label{display:flex;gap:10px;padding:5px 0;font-size:14.5px;cursor:pointer}input{accent-color:var(--p)}.muted{color:var(--g);font-size:12.5px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-mala/">🎒 Mala</a><a href="https://acarolmourad-commits.github.io/asf-checklist/">✅ Checklist</a><a href="https://acarolmourad-commits.github.io/asf-equipamento/">🏂 Equipamento</a><a href="https://acarolmourad-commits.github.io/asf-previsao/">🌊 Previsão</a></nav><header><h1>🎒 Mala de praia inteligente</h1><p>Escolha o tipo de sessão e receba a checklist perfeita.</p></header><main class="wrap"><div class="tipos"><button class="on" data-t="surf">Surf</button><button data-t="treino">Treino</button><button data-t="comp">Competição</button><button data-t="kids">Com as kids</button></div><div class="card"><div class="muted"><span id="pct">0</span>% pronto</div><div id="lista"></div></div><p class="muted">Confira as condições no <a href="https://acarolmourad-commits.github.io/asf-previsao/" style="color:var(--p)">ASF Previsão</a> antes de fechar a mala.</p></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>const base=['Prancha + leash','Protetor solar FPS 50+','Água (1L+)','Toalha','Lycra/wetsuit','Chave (esconder bem!)'];const extra={surf:['Parafina','Lanche pós-surf','Boné'],treino:['Elástico de resistência','Cronômetro no celular','Tênis para corrida na areia'],comp:['Carteirinha ASF','Prancha reserva','Barraca/sombra','Kit primeiros socorros'],kids:['Pranchinha de espuma','Colete/flutuador','Lanche extra','Muda de roupa','Brinquedos de areia']};const lista=document.getElementById('lista');function render(t){const itens=base.concat(extra[t]);lista.innerHTML='';itens.forEach(i=>lista.insertAdjacentHTML('beforeend',`<label><input type="checkbox"> ${i}</label>`));att();}function att(){const b=lista.querySelectorAll('input');let n=0;b.forEach(c=>c.checked&&n++);document.getElementById('pct').textContent=Math.round(n/b.length*100);}document.querySelectorAll('.tipos button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tipos button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.t);});lista.onchange=att;render('surf');</script></body></html>
